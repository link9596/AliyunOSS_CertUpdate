name: alioss-update-auto
env:
  TZ: Asia/Shanghai

on:
  schedule:
    - cron: "0 20 2 * *"   # 每月2号20:00 UTC（北京时间凌晨4点）
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install acme.sh
        run: |
          curl https://get.acme.sh | sh -s email=${{ secrets.EMAIL }}
          ~/.acme.sh/acme.sh --upgrade --auto-upgrade

      - name: Issue certificate via DNSPod
        env:
          DP_Id: ${{ secrets.DP_SecretId }}      # acme.sh 用这两个变量名
          DP_Key: ${{ secrets.DP_SecretKey }}
        run: |
          ~/.acme.sh/acme.sh --issue --dns dns_dp \
            -d "${{ secrets.DOMAIN }}" \
            --keylength ec-256 \
            --force

      - name: Export certificate to /etc/letsencrypt (兼容你原来的流程)
        run: |
          sudo mkdir -p /etc/letsencrypt/live/${{ secrets.DOMAIN }}
          sudo ~/.acme.sh/acme.sh --install-cert -d "${{ secrets.DOMAIN }}" \
            --fullchain-file /etc/letsencrypt/live/${{ secrets.DOMAIN }}/fullchain.pem \
            --key-file /etc/letsencrypt/live/${{ secrets.DOMAIN }}/privkey.pem

      - name: Run OSS Cert Update
        run: |
          CERT_PATH="/etc/letsencrypt/live/${{ secrets.DOMAIN }}"
          export CERTIFICATE="$(sudo cat $CERT_PATH/fullchain.pem)"
          export PRIVATE_KEY="$(sudo cat $CERT_PATH/privkey.pem)"
          python oss_update.py \
            --access-key-id "${{ secrets.ACCESS_KEY_ID }}" \
            --access-key-secret "${{ secrets.ACCESS_KEY_SECRET }}" \
            --endpoint "${{ secrets.ENDPOINT }}" \
            --bucket-name "${{ secrets.BUCKET_NAME }}" \
            --target-cname "${{ secrets.DOMAIN }}" \
            --private-key "$PRIVATE_KEY" \
            --certificate "$CERTIFICATE"
