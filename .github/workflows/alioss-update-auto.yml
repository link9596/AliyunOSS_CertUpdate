name: alioss-update-auto
env:
  TZ: Asia/Shanghai

on:
  schedule:
    - cron: "0 20 2 * *"   # 每月2号20点执行（UTC，北京时间凌晨4点）
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4    # 升级到v4，避免Node.js警告

      - name: Init Action
        run: |
          sudo apt update
          sudo apt install -y certbot curl openssl
          pip install -r requirements.txt

      # 将 dnspod.sh 放到系统路径，并赋予执行权限
      - name: Setup DNSPod Hook
        run: |
          sudo cp dnspod.sh /usr/local/bin/dnspod
          sudo chmod +x /usr/local/bin/dnspod

      # 申请证书：通过 sudo -E 保留环境变量
      - name: Apply for a new certificate
        env:
          DP_SecretId: ${{ secrets.DP_SecretId }}
          DP_SecretKey: ${{ secrets.DP_SecretKey }}
        run: |
          sudo mkdir -p /etc/letsencrypt/certs
          sudo -E certbot certonly -d "${{ secrets.DOMAIN }}" \
                --manual --preferred-challenges dns \
                --manual-auth-hook "/usr/local/bin/dnspod" \
                --manual-cleanup-hook "/usr/local/bin/dnspod clean" \
                --agree-tos --email ${{ secrets.EMAIL }} \
                --non-interactive

      # 上传证书到阿里云OSS（保留原有逻辑）
      - name: Run OSS Cert Update
        run: |
          CERT_PATH="/etc/letsencrypt/live/${{ secrets.DOMAIN }}"
          export CERTIFICATE="$(sudo cat $CERT_PATH/fullchain.pem)"
          export PRIVATE_KEY="$(sudo cat $CERT_PATH/privkey.pem)"
          python oss_update.py \
            --access-key-id "${{ secrets.ACCESS_KEY_ID }}" \
            --access-key-secret "${{ secrets.ACCESS_KEY_SECRET }}" \
            --endpoint "${{ secrets.ENDPOINT }}" \
            --bucket-name "${{ secrets.BUCKET_NAME }}" \
            --target-cname "${{ secrets.DOMAIN }}" \
            --private-key "$PRIVATE_KEY" \
            --certificate "$CERTIFICATE"
