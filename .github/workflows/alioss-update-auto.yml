name: alioss-update-auto
env:
  TZ: Asia/Shanghai

on:
  schedule:
    - cron: "0 20 2 * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install acme.sh and download dns_tencentcloud plugin
        run: |
          # 安装 acme.sh
          curl https://get.acme.sh | sh -s email=${{ secrets.EMAIL }}
          ~/.acme.sh/acme.sh --upgrade --auto-upgrade

          # 确保 dnsapi 目录存在
          mkdir -p ~/.acme.sh/dnsapi

          # 下载 dns_tencentcloud 插件（如果不存在）
          if [ ! -f ~/.acme.sh/dnsapi/dns_tencentcloud.sh ]; then
            echo "Downloading dns_tencentcloud plugin..."
            curl -o ~/.acme.sh/dnsapi/dns_tencentcloud.sh \
              https://raw.githubusercontent.com/acmesh-official/acme.sh/master/dnsapi/dns_tencentcloud.sh
            chmod +x ~/.acme.sh/dnsapi/dns_tencentcloud.sh
          fi

      - name: Issue certificate via DNSPod (Tencent Cloud API)
        env:
          DP_Id: ${{ secrets.DP_SecretId }}
          DP_Key: ${{ secrets.DP_SecretKey }}
        run: |
          ~/.acme.sh/acme.sh --issue --dns dns_tencentcloud \
            -d "${{ secrets.DOMAIN }}" \
            --keylength ec-256 \
            --server letsencrypt \
            --force

      - name: Export certificate
        run: |
          sudo mkdir -p /etc/letsencrypt/live/${{ secrets.DOMAIN }}
          sudo ~/.acme.sh/acme.sh --install-cert -d "${{ secrets.DOMAIN }}" \
            --fullchain-file /etc/letsencrypt/live/${{ secrets.DOMAIN }}/fullchain.pem \
            --key-file /etc/letsencrypt/live/${{ secrets.DOMAIN }}/privkey.pem

      - name: Run OSS Cert Update
        run: |
          CERT_PATH="/etc/letsencrypt/live/${{ secrets.DOMAIN }}"
          export CERTIFICATE="$(sudo cat $CERT_PATH/fullchain.pem)"
          export PRIVATE_KEY="$(sudo cat $CERT_PATH/privkey.pem)"
          python oss_update.py \
            --access-key-id "${{ secrets.ACCESS_KEY_ID }}" \
            --access-key-secret "${{ secrets.ACCESS_KEY_SECRET }}" \
            --endpoint "${{ secrets.ENDPOINT }}" \
            --bucket-name "${{ secrets.BUCKET_NAME }}" \
            --target-cname "${{ secrets.DOMAIN }}" \
            --private-key "$PRIVATE_KEY" \
            --certificate "$CERTIFICATE"
